name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Empty unless you add ANTHROPIC_API_KEY as a repository secret.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # Free: unit tests use a fake LLM client, so no API calls are made.
      - name: Unit tests
        run: python -m pytest -q

      # Free: the keyword baseline, for comparison.
      - name: Baseline accuracy (rules)
        run: python eval/run_eval.py --mapper rules --set all

      # Paid (a few cents): only runs when the secret exists.
      # The basic set is a quality gate: the build fails below 90%.
      - name: LLM accuracy, basic set (Claude)
        if: env.ANTHROPIC_API_KEY != ''
        run: python eval/run_eval.py --mapper llm --set basic --min-accuracy 0.9

      # The hard (decoy) set is report-only: misses here are expected and are
      # exactly what the human review step exists for.
      - name: LLM accuracy, hard set (Claude)
        if: env.ANTHROPIC_API_KEY != ''
        run: python eval/run_eval.py --mapper llm --set hard
